<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Request pipeline</title>
  <desc id="d">A question flows through authentication and rate limiting, a prompt-injection check and ACL-filtered retrieval, then to the language model, then citation validation, PII redaction and a hash-chained audit log. Every step except the language model is deterministic code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="355" rx="14" fill="#ffffff" stroke="#d9e0ea"/>

  <!-- Row 1 -->
  <g>
    <rect x="24" y="40" width="196" height="72" rx="10" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="122" y="71" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Question</text>
    <text x="122" y="92" text-anchor="middle" font-size="12" fill="#556275">user + API key</text>
  </g>
  <g>
    <rect x="264" y="40" width="196" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="362" y="71" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Auth + rate limit</text>
    <text x="362" y="92" text-anchor="middle" font-size="12" fill="#556275">identity, per-user window</text>
  </g>
  <g>
    <rect x="504" y="40" width="196" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="602" y="71" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Injection check</text>
    <text x="602" y="92" text-anchor="middle" font-size="12" fill="#556275">blocks hostile questions</text>
  </g>
  <g>
    <rect x="744" y="40" width="192" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="840" y="71" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">ACL-filtered retrieval</text>
    <text x="840" y="92" text-anchor="middle" font-size="12" fill="#556275">role filter before ranking</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="24" y="186" width="196" height="84" rx="10" fill="#f6f1ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="122" y="217" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">LLM</text>
    <text x="122" y="238" text-anchor="middle" font-size="12" fill="#5b21b6">mock · Claude · Ollama</text>
    <text x="122" y="256" text-anchor="middle" font-size="12" fill="#5b21b6">context is data, not orders</text>
  </g>
  <g>
    <rect x="264" y="192" width="196" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="362" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Citation validation</text>
    <text x="362" y="244" text-anchor="middle" font-size="12" fill="#556275">unknown sources removed</text>
  </g>
  <g>
    <rect x="504" y="192" width="196" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="602" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">PII redaction</text>
    <text x="602" y="244" text-anchor="middle" font-size="12" fill="#556275">email, phone, IBAN, HETU</text>
  </g>
  <g>
    <rect x="744" y="192" width="192" height="72" rx="10" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="840" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Audit log</text>
    <text x="840" y="244" text-anchor="middle" font-size="12" fill="#556275">hash-chained JSONL</text>
  </g>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M220 76 H260"/>
    <path d="M460 76 H500"/>
    <path d="M700 76 H740"/>
    <path d="M840 112 V148 H122 V182"/>
    <path d="M220 228 H260"/>
    <path d="M460 228 H500"/>
    <path d="M700 228 H740"/>
  </g>
  <text x="481" y="141" text-anchor="middle" font-size="11.5" fill="#556275">only chunks the user may read, and only if relevant</text>

  <!-- Legend -->
  <g font-size="12" fill="#556275">
    <rect x="24" y="314" width="30" height="20" rx="5" fill="#f3f7ff" stroke="#3b63c9" stroke-width="1.5"/>
    <text x="64" y="328">Deterministic code, covered by tests and eval gates</text>
    <rect x="420" y="314" width="30" height="20" rx="5" fill="#f6f1ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="460" y="328">Model call, output treated as untrusted</text>
  </g>
</svg>
